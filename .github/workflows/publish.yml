name: Publish Extension

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          # Cross-platform builds
          - os: ubuntu-latest
            target: linux-arm64
            cross: true
            cross_cpu: arm64
            cross_os: linux
          - os: windows-latest
            target: win32-arm64
            cross: true
            cross_cpu: arm64
            cross_os: win32
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install cross-platform sharp binary
        if: matrix.cross == true
        run: npm install --cpu=${{ matrix.cross_cpu }} --os=${{ matrix.cross_os }} sharp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build
        run: npm run bundle:prod

      - name: Package extension
        run: npx @vscode/vsce package --target ${{ matrix.target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipshot-vsix-${{ matrix.target }}
          path: "*.vsix"
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: clipshot-vsix-*
          merge-multiple: true

      - name: List VSIX files
        run: ls -la *.vsix

      - name: Publish all platform VSIXs to Marketplace
        run: |
          for vsix in *.vsix; do
            echo "Publishing $vsix..."
            npx @vscode/vsce publish --packagePath "$vsix" -p ${{ secrets.VSCE_PAT }}
          done
