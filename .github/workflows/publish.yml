name: Publish Extension

on:
  release:
    types: [published]

# Every job below already narrows this further. Declaring it here as well is what
# keeps a job added later from silently inheriting whatever the repository default
# happens to be at the time — which matters more in the workflow that holds the
# publishing credential.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          # Cross-platform builds
          - os: ubuntu-latest
            target: linux-arm64
            cross: true
          - os: windows-latest
            target: win32-arm64
            cross: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Native targets get their sharp binary from `npm ci`. The two cross
      # targets need one npm will not install, because it does not match the
      # host's os/cpu — so it is taken straight out of the lockfile, tarball
      # and sha512 alike. This is the workflow that publishes, so "pinned by
      # version" was not enough: a hash that does not match fails the build.
      - name: Fetch cross-platform sharp binary
        if: matrix.cross == true
        run: node scripts/fetch-cross-sharp.mjs ${{ matrix.target }}

      - name: Build
        run: npm run bundle:prod

      - name: Package extension
        run: npx @vscode/vsce package --target ${{ matrix.target }}

      # The same check CI runs, which this workflow had never had — the commit
      # that introduced it said "add CI step to verify VSIX before release" and
      # only landed in ci.yml. It unpacks the VSIX, confirms the target's sharp
      # binary is inside and loads the module, so a broken package fails here
      # rather than on a user's machine. `publish` needs every `build`, so one
      # bad target stops the whole release instead of shipping five of six.
      - name: Verify VSIX dependencies
        run: node scripts/verify-vsix.mjs ${{ matrix.target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipshot-vsix-${{ matrix.target }}
          path: "*.vsix"
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clipshot-vsix-*
          merge-multiple: true

      - name: List VSIX files
        run: ls -la *.vsix

      - name: Publish all platform VSIXs to Marketplace
        run: |
          for vsix in *.vsix; do
            echo "Publishing $vsix..."
            npx @vscode/vsce publish --packagePath "$vsix" -p ${{ secrets.VSCE_PAT }}
          done
