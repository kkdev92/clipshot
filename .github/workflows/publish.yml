name: Publish Extension

on:
  release:
    types: [published]
  # A manual run publishes nothing: it runs only `check-credential` below. The
  # environment admits `v*` tags, so a manual run from a release tag works as it
  # is, and one from a branch needs that branch allowed on the environment for
  # the duration.
  workflow_dispatch:

# Every job below already narrows this further. Declaring it here as well is what
# keeps a job added later from silently inheriting whatever the repository default
# happens to be at the time — which matters more in the workflow that holds the
# publishing credential.
permissions:
  contents: read

jobs:
  test:
    # `build` and `publish` hang off this job, so a manual run skips all three.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          # Cross-platform builds
          - os: ubuntu-latest
            target: linux-arm64
            cross: true
          - os: windows-latest
            target: win32-arm64
            cross: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Native targets get their sharp binary from `npm ci`. The two cross
      # targets need one npm will not install, because it does not match the
      # host's os/cpu — so it is taken straight out of the lockfile, tarball
      # and sha512 alike. This is the workflow that publishes, so "pinned by
      # version" was not enough: a hash that does not match fails the build.
      - name: Fetch cross-platform sharp binary
        if: matrix.cross == true
        run: node scripts/fetch-cross-sharp.mjs ${{ matrix.target }}

      - name: Build
        run: npm run bundle:prod

      - name: Package extension
        run: npx @vscode/vsce package --target ${{ matrix.target }}

      # The same check CI runs, which this workflow had never had — the commit
      # that introduced it said "add CI step to verify VSIX before release" and
      # only landed in ci.yml. It unpacks the VSIX, confirms the target's sharp
      # binary is inside and loads the module, so a broken package fails here
      # rather than on a user's machine. `publish` needs every `build`, so one
      # bad target stops the whole release instead of shipping five of six.
      - name: Verify VSIX dependencies
        run: node scripts/verify-vsix.mjs ${{ matrix.target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipshot-vsix-${{ matrix.target }}
          path: "*.vsix"
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Publishing to the Marketplace waits for an approval. The environment also
    # restricts what may deploy to it to `v*` tags, which is the ref every
    # release this workflow has ever run on.
    #
    # No credential is stored. The job signs in to Microsoft Entra ID as a
    # managed identity, through a federated credential that trusts only this
    # environment of this repository (by repository and owner ID, not by name),
    # and the Marketplace lets that identity publish as kkdev92.
    #
    # `id-token: write` lets any step of this job ask for the token that sign-in
    # exchanges, so the job runs nothing it does not need: it builds nothing
    # (the packages come from `build`) and installs without install scripts.
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # vsce at the version the lockfile pins, rather than whatever the registry
      # serves at publish time.
      - name: Install vsce from the lockfile
        run: npm ci --ignore-scripts

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clipshot-vsix-*
          merge-multiple: true

      - name: List VSIX files
        run: ls -la *.vsix

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish all platform VSIXs to Marketplace
        run: |
          for vsix in *.vsix; do
            echo "Publishing $vsix..."
            npx @vscode/vsce publish --packagePath "$vsix" --azure-credential
          done

  # The manual run. It signs in the way `publish` does and asks the Marketplace
  # whether that identity may publish as kkdev92 (`vsce verify-pat` accepts an
  # Entra credential in place of a PAT), so a broken credential shows up before a
  # release rather than in the middle of one. It also prints the identity's
  # Azure DevOps profile id, which is what the publisher's member list takes.
  check-credential:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install vsce from the lockfile
        run: npm ci --ignore-scripts

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show the identity's Azure DevOps profile id
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      - name: Check that the identity may publish as kkdev92
        run: npx @vscode/vsce verify-pat kkdev92 --azure-credential
