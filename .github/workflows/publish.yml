name: Publish Extension

on:
  release:
    types: [published]

# Every job below already narrows this further. Declaring it here as well is what
# keeps a job added later from silently inheriting whatever the repository default
# happens to be at the time — which matters more in the workflow that holds the
# publishing credential.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          # Cross-platform builds
          - os: ubuntu-latest
            target: linux-arm64
            cross: true
            cross_cpu: arm64
            cross_os: linux
          - os: windows-latest
            target: win32-arm64
            cross: true
            cross_cpu: arm64
            cross_os: win32
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The version comes from the lockfile rather than from the range in
      # package.json. Native targets get sharp through `npm ci`, so they are
      # already pinned; without this the cross targets re-resolve `^0.35.x` and a
      # release published in between would ship a different, untested sharp inside
      # some of the VSIXs of the same version. This is the workflow that publishes
      # them, so that would reach users.
      - name: Install cross-platform sharp binary
        if: matrix.cross == true
        shell: bash
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version")
          npm install --cpu=${{ matrix.cross_cpu }} --os=${{ matrix.cross_os }} "sharp@$version"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build
        run: npm run bundle:prod

      - name: Package extension
        run: npx @vscode/vsce package --target ${{ matrix.target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipshot-vsix-${{ matrix.target }}
          path: "*.vsix"
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clipshot-vsix-*
          merge-multiple: true

      - name: List VSIX files
        run: ls -la *.vsix

      - name: Publish all platform VSIXs to Marketplace
        run: |
          for vsix in *.vsix; do
            echo "Publishing $vsix..."
            npx @vscode/vsce publish --packagePath "$vsix" -p ${{ secrets.VSCE_PAT }}
          done
