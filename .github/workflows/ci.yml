name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job below already narrows this further. Declaring it here as well is what
# keeps a job added later from silently inheriting whatever the repository default
# happens to be at the time.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run compile

      - name: Type check tests
        run: npm run typecheck:test

  unit-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run unit tests with coverage
        run: npm run test:coverage

  integration-test:
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run integration tests
        run: npm run test:integration

  build:
    needs: [unit-test, integration-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds (npm ci installs the matching binary)
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          # Cross-platform builds (binary comes from the lockfile)
          - os: ubuntu-latest
            target: linux-arm64
            cross: true
          - os: windows-latest
            target: win32-arm64
            cross: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Native targets get their sharp binary from `npm ci`. The two cross
      # targets need one npm will not install, because it does not match the
      # host's os/cpu — so it is taken straight out of the lockfile, tarball
      # and sha512 alike. A hash that does not match fails the build, and
      # nothing here re-resolves a range.
      - name: Fetch cross-platform sharp binary
        if: matrix.cross == true
        run: node scripts/fetch-cross-sharp.mjs ${{ matrix.target }}

      - name: Build
        run: npm run bundle:prod

      - name: Package extension
        run: npx @vscode/vsce package --target ${{ matrix.target }}

      - name: Verify VSIX dependencies
        run: node scripts/verify-vsix.mjs ${{ matrix.target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipshot-vsix-${{ matrix.target }}
          path: "*.vsix"
          retention-days: 7
